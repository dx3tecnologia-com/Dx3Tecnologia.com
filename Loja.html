<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja DX3 Tecnologia</title>
<link rel="stylesheet" href="loja.css">
</head>
<body>

<h1>🛒 Loja DX3 Tecnologia</h1>

<div class="topo-loja">
  <button onclick="voltar()" class="btn-voltar">← Voltar</button>
</div>
  
<div class="container-loja">

  <div class="produtos">
    <!-- SEUS CARDS AQUI -->
     <!-- RASTREADOR -->
  <div class="card">
  <h2>Rastreador Veicular</h2>
  <p>R$ <span class="preco">199</span></p>

  <div class="botoes">
    <button onclick="adicionar('Rastreador Veicular',199,this)">+</button>
    <button onclick="remover('Rastreador Veicular',199)">-</button>
  </div>
</div>

  <!-- CAMERA -->
  <div class="card">
    <h2>Câmera Monitoramento</h2>
    <p>R$ <span class="preco">299</span></p>

  <div class="botoes">
     <button onclick="adicionar('Câmera Monitoramento',299,this)">+</button>
      <button onclick="remover('Câmera Monitoramento',299)">-</button>
    </div>
   
  </div>

  <!-- COMPONENTE -->
  <div class="card">
    <h2>Componentes Eletrônicos</h2>
    <p>R$ <span class="preco">89</span></p>

    <div class="botoes">
      <button onclick="adicionar('Componentes Eletrônicos',89,this)">+</button>
      <button onclick="remover('Componentes Eletrônicos',89)">-</button>
    </div>

</div>

<hr>

<div class="carrinho">
  <h2>🧾 Pedido</h2>
  <ul id="lista"></ul>
  <h3>Total: R$ <span id="total">0</span></h3>
  <button onclick="enviarPedido()">Enviar Pedido</button>
</div>

<script src="loja.js"></script>
</body>

</html>
